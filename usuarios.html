<!doctype html>
<html lang="pt-BR"><head><title>Usuários — Julia Pescados</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="img/marca/logo-julia-32.png"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fdf1e6;color:#3d1410;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}main{width:100%;max-width:400px;background:#fff;border:1px solid #ecd5c2;border-radius:14px;padding:28px;box-shadow:0 8px 30px rgba(92,26,18,.08)}main.larga{max-width:760px}img.logo{display:block;margin:0 auto 12px;width:72px;height:72px}h1{font-size:20px;margin:0 0 4px;text-align:center}p.sub{margin:0 0 18px;text-align:center;color:#7a5a4f;font-size:14px}label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}input,select{width:100%;padding:11px 12px;border:1px solid #d8bfae;border-radius:8px;font:inherit;background:#fff}input:focus,select:focus{outline:3px solid #f0a35e;outline-offset:1px}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:#5c1a12;color:#fff;font:600 16px inherit;cursor:pointer}button:hover{background:#7a2418}.erro{color:#a1180a;font-size:14px;margin-top:12px;min-height:20px}.ok{color:#1d7a43}table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #f0e0d2}td button,.mini{margin:0;width:auto;padding:5px 10px;font-size:13px}a{color:#8a3a10}.linha{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.linha{grid-template-columns:1fr}}</style></head>
<body><main class="larga">
<h1>Usuários do painel</h1><p class="sub"><a href="/admin">← Voltar ao painel</a> · <a href="/api/sair">Sair</a></p>
<div id="lista">Carregando…</div>
<h2 style="font-size:17px;margin-top:22px">Novo usuário</h2>
<form id="f">
<div class="linha"><div><label for="un">Usuário (login)</label><input id="un" required pattern="[a-z0-9._-]{3,40}" autocapitalize="none"></div>
<div><label for="nm">Nome</label><input id="nm" required></div></div>
<div class="linha"><div><label for="pp">Papel</label><select id="pp"><option value="operador">Operador</option><option value="admin">Administrador</option></select></div>
<div><label for="sp">Senha provisória (mínimo 10)</label><input id="sp" minlength="10" required autocomplete="off"></div></div>
<button type="submit">Criar usuário</button><div class="erro" id="e" role="alert"></div>
</form>
<h2 style="font-size:17px;margin-top:28px">Registro de atividade <small style="font-weight:400">(últimas 200 ações, só o administrador vê)</small></h2>
<div id="aud">Carregando…</div></main>
<script>
function api(m, u, b) { return fetch(u, { method: m, headers: { 'Content-Type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.erro || 'Erro'); return j; }); }); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function lista() {
  api('GET', '/api/usuarios').then(function (us) {
    document.getElementById('lista').innerHTML = '<table><tr><th>Usuário</th><th>Nome</th><th>Papel</th><th>Situação</th><th></th></tr>' + us.map(function (u) {
      return '<tr><td>' + esc(u.usuario) + '</td><td>' + esc(u.nome) + '</td><td>' + (u.papel === 'admin' ? 'Administrador' : 'Operador') + '</td><td>' + (u.ativo ? (u.senha_provisoria ? 'Ativo (senha provisória)' : 'Ativo') : 'Desativado') + '</td>' +
        '<td><button class="mini" data-a="' + (u.ativo ? 'des' : 'ati') + '" data-id="' + u.id + '">' + (u.ativo ? 'Desativar' : 'Reativar') + '</button> <button class="mini" data-a="sen" data-id="' + u.id + '">Nova senha</button></td></tr>';
    }).join('') + '</table>';
  }).catch(function (e) { document.getElementById('lista').textContent = e.message; });
}
document.getElementById('lista').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return; var id = b.dataset.id, a = b.dataset.a;
  var p = a === 'sen' ? (prompt('Nova senha provisória (mínimo 10 caracteres). A pessoa troca no próximo acesso:') || null) : null;
  if (a === 'sen' && !p) return;
  api('PATCH', '/api/usuarios/' + id, a === 'sen' ? { senha: p } : { ativo: a === 'ati' }).then(lista).catch(function (e) { alert(e.message); });
});
document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault(); var e = document.getElementById('e'); e.className = 'erro'; e.textContent = '';
  api('POST', '/api/usuarios', { usuario: document.getElementById('un').value, nome: document.getElementById('nm').value, papel: document.getElementById('pp').value, senha: document.getElementById('sp').value })
    .then(function () { e.className = 'erro ok'; e.textContent = 'Usuário criado. Passe a senha provisória a ele; será trocada no primeiro acesso.'; document.getElementById('f').reset(); lista(); })
    .catch(function (x) { e.textContent = x.message; });
});
lista();
api('GET', '/api/auditoria').then(function (a) {
  document.getElementById('aud').innerHTML = a.length ? '<table><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Detalhe</th></tr>' + a.map(function (x) { return '<tr><td>' + esc(new Date(x.quando).toLocaleString('pt-BR')) + '</td><td>' + esc(x.usuario || '—') + '</td><td>' + esc(x.acao) + '</td><td>' + esc(x.detalhe || '') + '</td></tr>'; }).join('') + '</table>' : 'Nada registrado ainda.';
}).catch(function (e) { document.getElementById('aud').textContent = e.message; });
</script></body></html>
