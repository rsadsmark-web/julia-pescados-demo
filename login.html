<!doctype html>
<html lang="pt-BR"><head><title>Entrar — Julia Pescados</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="img/marca/logo-julia-32.png"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fdf1e6;color:#3d1410;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}main{width:100%;max-width:400px;background:#fff;border:1px solid #ecd5c2;border-radius:14px;padding:28px;box-shadow:0 8px 30px rgba(92,26,18,.08)}main.larga{max-width:760px}img.logo{display:block;margin:0 auto 12px;width:72px;height:72px}h1{font-size:20px;margin:0 0 4px;text-align:center}p.sub{margin:0 0 18px;text-align:center;color:#7a5a4f;font-size:14px}label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}input,select{width:100%;padding:11px 12px;border:1px solid #d8bfae;border-radius:8px;font:inherit;background:#fff}input:focus,select:focus{outline:3px solid #f0a35e;outline-offset:1px}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;background:#5c1a12;color:#fff;font:600 16px inherit;cursor:pointer}button:hover{background:#7a2418}.erro{color:#a1180a;font-size:14px;margin-top:12px;min-height:20px}.ok{color:#1d7a43}table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #f0e0d2}td button,.mini{margin:0;width:auto;padding:5px 10px;font-size:13px}a{color:#8a3a10}.linha{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.linha{grid-template-columns:1fr}}</style></head>
<body><main>
<img class="logo" src="img/marca/logo-julia-192.png" alt="Julia Pescados">
<h1>Julia Pescados</h1><p class="sub">Entre com seu usuário e senha</p>
<form id="f" autocomplete="on">
<label for="u">Usuário</label><input id="u" name="usuario" autocomplete="username" autocapitalize="none" required autofocus>
<label for="s">Senha</label><input id="s" name="senha" type="password" autocomplete="current-password" required>
<button type="submit">Entrar</button><div class="erro" id="e" role="alert"></div>
</form></main>
<script>
document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault(); var e = document.getElementById('e'); e.textContent = '';
  fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usuario: document.getElementById('u').value, senha: document.getElementById('s').value }) })
    .then(function (r) { return r.json().then(function (j) { return [r.ok, j]; }); })
    .then(function (x) {
      if (!x[0]) { e.textContent = x[1].erro || 'Não foi possível entrar.'; return; }
      var n = new URLSearchParams(location.search).get('next');
      location.href = x[1].trocar ? '/trocar-senha' : (n && n.charAt(0) === '/' && n.charAt(1) !== '/' ? n : '/admin');
    }).catch(function () { e.textContent = 'Sem conexão com o servidor.'; });
});
</script></body></html>
